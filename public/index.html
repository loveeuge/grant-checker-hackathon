<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrantReady | 지원사업 체크메이트</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">GR</div>
          <div>
            <p class="eyebrow">지원사업 체크메이트</p>
            <h1>GrantReady</h1>
          </div>
        </div>
        <div class="status-strip" aria-label="서비스 상태">
          <span id="api-status-pill" class="status-pill is-checking">
            <i data-lucide="radio-tower" aria-hidden="true"></i>
            API 확인 중
          </span>
          <span id="mode-pill" class="status-pill is-live">
            <i data-lucide="activity" aria-hidden="true"></i>
            Live mode
          </span>
          <a class="button ghost topbar-link" href="./admin.html">
            <i data-lucide="settings" aria-hidden="true"></i>
            관리자
          </a>
        </div>
      </header>

      <main class="workspace">
        <section class="intro-band" aria-labelledby="page-title">
          <div>
            <p class="eyebrow">Hackathon Demo</p>
            <h2 id="page-title">공고문과 팀 준비 현황을 한 번에 대조합니다</h2>
          </div>
          <p>
            지원 가능성, 자격요건, 제출서류 누락, 보완 질문과 최종 체크리스트를 발표용 화면에서 바로 확인하세요.
          </p>
        </section>

        <div id="notice-banner" class="notice-banner hidden" role="status"></div>

        <section class="panel input-panel" aria-labelledby="input-title">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Inputs</p>
              <h2 id="input-title">검토 자료</h2>
            </div>
            <div class="action-row">
              <button id="sample-button" class="button ghost" type="button">
                <i data-lucide="wand-sparkles" aria-hidden="true"></i>
                샘플 채우기
              </button>
              <button id="analyze-button" class="button primary" type="button">
                <i data-lucide="scan-search" aria-hidden="true"></i>
                분석하기
              </button>
            </div>
          </div>

          <div class="input-grid">
            <label class="text-field" for="grant-notice">
              <span>
                <strong>공고문</strong>
                <small>지원대상, 제외요건, 제출서류, 평가항목을 포함해 주세요.</small>
              </span>
              <div class="notice-importer">
                <div class="import-row">
                  <input id="notice-file-input" type="file" accept=".pdf,.docx,.pptx,.txt,.md,.markdown,.csv,.json,.html,.htm,.jpg,.jpeg,.png,.webp,.gif,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/*,image/jpeg,image/png,image/webp,image/gif" />
                  <button id="notice-file-button" class="button ghost" type="button">
                    <i data-lucide="file-up" aria-hidden="true"></i>
                    파일 불러오기
                  </button>
                  <div class="url-load-row">
                    <input id="notice-url-input" type="url" placeholder="공고문 URL" autocomplete="off" spellcheck="false" />
                    <button id="notice-url-button" class="button ghost" type="button">
                      <i data-lucide="link" aria-hidden="true"></i>
                      URL 불러오기
                    </button>
                  </div>
                </div>
                <p id="notice-import-note" class="form-note" role="status">PDF, DOCX, PPTX, TXT, JPG, PNG, URL을 불러오면 공고문 칸에 자동 입력됩니다. 사진 추출은 API key 등록 후 작동합니다.</p>
              </div>
              <textarea id="grant-notice" placeholder="예: 2026년 초기창업패키지 모집 공고..."></textarea>
            </label>

            <label class="text-field" for="team-intro">
              <span>
                <strong>팀 소개</strong>
                <small>사업자 상태, 업력, 지역, 핵심 기술, 매출/고용 현황을 적어 주세요.</small>
              </span>
              <div class="team-importer">
                <div class="import-row">
                  <input id="team-file-input" type="file" accept=".pdf,.docx,.pptx,.txt,.md,.markdown,.csv,.json,.html,.htm,.jpg,.jpeg,.png,.webp,.gif,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/*,image/jpeg,image/png,image/webp,image/gif" />
                  <button id="team-file-button" class="button ghost" type="button">
                    <i data-lucide="presentation" aria-hidden="true"></i>
                    회사소개서 불러오기
                  </button>
                </div>
                <p id="team-import-note" class="form-note" role="status">IR, 회사소개서, 팀 소개 파일이나 사진을 불러오면 팀 소개 칸에 자동 입력됩니다. 사진 추출은 API key 등록 후 작동합니다.</p>
              </div>
              <textarea id="team-intro" placeholder="예: 서울 소재 예비창업팀으로 AI 문서 자동화 서비스를 준비 중..."></textarea>
            </label>

            <label class="text-field" for="prepared-documents">
              <span>
                <strong>준비 서류</strong>
                <small>이미 확보한 서류와 발급 예정 서류를 줄 단위로 넣으면 좋습니다.</small>
              </span>
              <div class="documents-importer">
                <div class="import-row">
                  <input id="documents-file-input" type="file" multiple accept=".pdf,.docx,.pptx,.txt,.md,.markdown,.csv,.json,.html,.htm,.jpg,.jpeg,.png,.webp,.gif,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/*,image/jpeg,image/png,image/webp,image/gif" />
                  <button id="documents-file-button" class="button ghost" type="button">
                    <i data-lucide="folder-up" aria-hidden="true"></i>
                    준비서류 첨부
                  </button>
                </div>
                <p id="documents-import-note" class="form-note" role="status">여러 파일과 사진을 첨부하면 파일명과 추출 내용을 준비서류 목록으로 정리합니다. 사진 추출은 API key 등록 후 작동합니다.</p>
              </div>
              <textarea id="prepared-documents" placeholder="예: 사업계획서 초안, 대표자 신분증, 개인정보 수집 동의서..."></textarea>
            </label>
          </div>
        </section>

        <section class="results-panel" aria-labelledby="results-title">
          <div class="panel-heading results-heading">
            <div>
              <p class="section-kicker">Results</p>
              <h2 id="results-title">분석 결과</h2>
            </div>
            <span id="result-timestamp" class="timestamp">아직 분석 전입니다</span>
          </div>
          <div id="results-content" class="results-content">
            <div class="empty-state">
              <i data-lucide="clipboard-check" aria-hidden="true"></i>
              <h3>자료를 입력하고 분석을 시작하세요</h3>
              <p>결과는 지원 가능성 요약, 자격요건 체크표, 제출서류 누락표, 보완 질문, 최종 체크리스트로 정리됩니다.</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
